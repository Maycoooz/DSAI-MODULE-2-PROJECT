version: 2

models:
  - name: stg_orders
    description: "Cleaned orders with timestamps cast and delivery_days computed"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests: [not_null]

  - name: stg_order_items
    description: "Order line items with price and freight cast to FLOAT64"
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]

  - name: stg_customers
    description: "Cleaned customer records with standardised city/state casing"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]

  - name: stg_products
    description: "Products with category name and dimensions cast"
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    description: "Seller records with standardised city/state casing"
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_payments
    description: "Payment records per order"
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_value
        tests: [not_null]

  - name: stg_reviews
    description: "Customer reviews with timestamps cast"
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

  - name: stg_geolocation
    description: "Geolocation data by zip code prefix"
    columns:
      - name: zip_code_prefix
        tests: [not_null]

  - name: stg_category_translation
    description: "Portuguese to English category name mapping"
    columns:
      - name: product_category_name
        tests: [unique, not_null]
