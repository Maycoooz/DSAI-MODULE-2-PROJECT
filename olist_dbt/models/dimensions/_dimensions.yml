version: 2

models:
  - name: dim_customers
    description: "Customer dimension with order history aggregates"
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: "Product dimension with English category translation"
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_sellers
    description: "Seller dimension with location info"
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Date dimension spanning 2016–2020"
    columns:
      - name: date_day
        tests: [unique, not_null]
